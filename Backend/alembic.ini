# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date
# within the migration file as well as the filename.
# timezone = UTC

# max length of characters to use for slug;
# truncate to this length
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow modules to be loaded
# from sys.path, which is useful when importing models
# prepend_sys_path = .

# version path separator; defaults to os.pathsep.
# Use a semicolon for Windows compatibility.
# version_path_separator = ;

# set to 'true' to search for version files recursively
# recursive_version_locations = false

# output encoding; defaults to utf-8
# output_encoding = utf-8

sqlalchemy.url = postgresql://postgres:postgres@db:5432/corn_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
