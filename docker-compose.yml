version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: corn_postgres_db
    restart: always
    environment:
      POSTGRES_DB: corn_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: corn_fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/corn_db
      - JWT_SECRET=corn_model_jwt_secret_key_2026_change_me_in_production
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=adminpassword
    depends_on:
      - db

volumes:
  postgres_data:
